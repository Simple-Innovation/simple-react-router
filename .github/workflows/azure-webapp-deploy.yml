# This workflow will build and deploy a React application to an Azure Web App.
# It uses Bicep to provision Azure resources automatically.
#
# To configure this workflow:
#
# 1. Create an Azure Service Principal with Contributor access to your subscription:
#    az ad sp create-for-rbac --name "simple-react-router-deploy" --role contributor \
#      --scopes /subscriptions/{subscription-id} --sdk-auth
#
# 2. Create the following secrets and repository variables in your repository (Settings > Secrets and variables > Actions):
#    - AZURE_CREDENTIALS (secret): The entire JSON output from step 1
#    - SQL_ADMIN_PASSWORD (secret): A secure password for SQL Server admin (min 8 chars, uppercase, lowercase, numbers, symbols)
#    - AZURE_SUBSCRIPTION_ID (repository Variable): Your Azure subscription ID
#    - AZURE_RESOURCE_GROUP_NAME (repository Variable): Name of the resource group to create/use (e.g., 'simple-react-router-rg')
#
# 3. Optionally, configure Azure AD administrator for SQL Server (if you want a specific user instead of auto-detection):
#    - SQL_AZUREAD_ADMIN_USER (repository Variable): Azure AD admin user email or service principal name
#    - SQL_AZUREAD_ADMIN_OBJECT_ID (repository Variable): Object ID of the Azure AD admin user
#    Note: Both variables must be provided together. If not provided, the current logged-in user (service principal) will be used.
#
# 4. Optionally, change the AZURE_WEBAPP_NAME, AZURE_LOCATION, and other environment variables below.
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples

name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:
    # Allows manual deployment from any branch

env:
  # Read the web app name from a GitHub repository variable named `AZURE_WEBAPP_NAME`.
  # If the variable is not set, fall back to a sensible default to reduce naming collisions.
  # You can set the repository variable in the repo's Settings > Variables > Actions > New repository variable.
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'simple-react-router-web' }}
  AZURE_WEBAPP_PACKAGE_PATH: "ui-dist" # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: "22.x" # set this to the node version to use
  # Read the Azure region from a GitHub repository variable named `AZURE_LOCATION`.
  # If the variable is not set, fall back to 'uksouth'.
  # You can set the repository variable in the repo's Settings > Variables > Actions > New repository variable.
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'uksouth' }} # Azure region for resources
  # Read the App Service Plan SKU from a GitHub repository variable named `APP_SERVICE_PLAN_SKU`.
  # If the variable is not set, fall back to 'F1'.
  # You can set the repository variable in the repo's Settings > Variables > Actions > New repository variable.
  APP_SERVICE_PLAN_SKU: ${{ vars.APP_SERVICE_PLAN_SKU || 'F1' }} # App Service Plan SKU (F1=Free, B1=Basic, S1=Standard)
  # Read subscription id from a repository variable named `AZURE_SUBSCRIPTION_ID`.
  # NOTE: we do NOT default to reading the subscription id from a secret; set it as a repository Variable.
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # Read the Resource Group name from a repository variable named `AZURE_RESOURCE_GROUP_NAME`.
  # This workflow requires that repository Variable to be set. Do NOT store the resource group name as a secret.
  # If the repository Variable isn't set, fall back to a sensible default resource group name.
  AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME || 'simple-react-router-rg' }}

permissions:
  contents: read
  id-token: write

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    outputs:
      webAppName: ${{ steps.deploy-infra.outputs.webAppName }}
    steps:
      - uses: actions/checkout@v4

      - name: Pre-check resolved environment (non-secret values)
        run: |
          set -euo pipefail
          echo "Resolved environment values (secrets are hidden)"
          echo "AZURE_WEBAPP_NAME=${AZURE_WEBAPP_NAME:-<not set>}"
          echo "AZURE_LOCATION=${AZURE_LOCATION:-<not set>}"
          echo "APP_SERVICE_PLAN_SKU=${APP_SERVICE_PLAN_SKU:-<not set>}"
          echo "AZURE_RESOURCE_GROUP_NAME=${AZURE_RESOURCE_GROUP_NAME:-<not set>}"
          echo "NODE_VERSION=${NODE_VERSION:-<not set>}"
          echo "AZURE_WEBAPP_PACKAGE_PATH=${AZURE_WEBAPP_PACKAGE_PATH:-<not set>}"
          if [[ -n "${AZURE_SUBSCRIPTION_ID-}" ]]; then
            echo "AZURE_SUBSCRIPTION_ID=present"
          else
            echo "AZURE_SUBSCRIPTION_ID=<not set>"
          fi
          # Compute and show the App Service Plan name derived from the web app name
          APP_SERVICE_PLAN_NAME="${AZURE_WEBAPP_NAME:-simple-react-router-web}-plan"
          echo "APP_SERVICE_PLAN_NAME=${APP_SERVICE_PLAN_NAME}"

      - name: Validate inputs
        id: validate-inputs
        run: |
          set -euo pipefail
          echo "::group::Validate inputs"
          echo "Validating workflow inputs..."

          # Read values from environment
          SKU="$APP_SERVICE_PLAN_SKU"
          LOCATION="$AZURE_LOCATION"
          WEBAPP_NAME="$AZURE_WEBAPP_NAME"

          # Validate SKU against a short allowlist
          ALLOWED_SKUS=(F1 B1 S1)
          if [[ ! " ${ALLOWED_SKUS[*]} " =~ " ${SKU} " ]]; then
            echo "::error title=Invalid App Service Plan SKU::APP_SERVICE_PLAN_SKU='${SKU}' is not valid. Allowed: ${ALLOWED_SKUS[*]}"
            echo "::error::Set APP_SERVICE_PLAN_SKU via repository Variables (Settings → Variables → Actions) or update the workflow."
            echo "::endgroup::"
            exit 1
          else
            echo "::notice title=SKU OK::APP_SERVICE_PLAN_SKU='${SKU}'"
          fi

          # Validate location against a small allowlist
          ALLOWED_LOCS=(uksouth eastus westeurope northeurope centralus westus)
          if [[ ! " ${ALLOWED_LOCS[*]} " =~ " ${LOCATION} " ]]; then
            echo "::error title=Invalid Azure Location::AZURE_LOCATION='${LOCATION}' is not allowed. Allowed: ${ALLOWED_LOCS[*]}"
            echo "::endgroup::"
            exit 1
          else
            echo "::notice title=Location OK::AZURE_LOCATION='${LOCATION}'"
          fi

          # Validate web app name: DNS label rules (2-60 chars, alphanumeric and hyphens, cannot start or end with hyphen)
          if [[ -z "${WEBAPP_NAME}" ]]; then
            echo "::error title=Missing Web App Name::AZURE_WEBAPP_NAME is empty. The workflow will default to 'simple-react-router-web' if not provided; to override set repository Variable AZURE_WEBAPP_NAME under Settings → Variables → Actions."
            echo "::endgroup::"
            exit 1
          fi
          if [[ ${#WEBAPP_NAME} -lt 2 || ${#WEBAPP_NAME} -gt 60 ]]; then
            echo "::error title=Invalid Web App Name Length::AZURE_WEBAPP_NAME must be between 2 and 60 characters. Current length=${#WEBAPP_NAME}"
            echo "::endgroup::"
            exit 1
          fi
          if [[ ! "${WEBAPP_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9-]*[A-Za-z0-9]$ ]]; then
            echo "::error title=Invalid Web App Name Format::AZURE_WEBAPP_NAME='${WEBAPP_NAME}' must start and end with an alphanumeric character and may contain hyphens in between."
            echo "::endgroup::"
            exit 1
          fi

          echo "::notice title=Web App Name OK::AZURE_WEBAPP_NAME='${WEBAPP_NAME}'"
          echo "::endgroup::"
          echo "::notice::All inputs look good: SKU=${SKU}, LOCATION=${LOCATION}, WEBAPP_NAME=${WEBAPP_NAME}"

          # Validate resource group variable is set (we require a repository Variable named AZURE_RESOURCE_GROUP_NAME)
          if [[ -z "${AZURE_RESOURCE_GROUP_NAME-}" ]]; then
            echo "::error title=Missing Resource Group Variable::Repository Variable AZURE_RESOURCE_GROUP_NAME is not set. Create it under Settings → Variables → Actions and set the resource group name."
            echo "::endgroup::"
            exit 1
          else
            echo "::notice title=Resource Group OK::AZURE_RESOURCE_GROUP_NAME='${AZURE_RESOURCE_GROUP_NAME}'"
          fi

          # Validate subscription id repository Variable is set
          if [[ -z "${AZURE_SUBSCRIPTION_ID-}" ]]; then
            echo "::error title=Missing Subscription Variable::Repository Variable AZURE_SUBSCRIPTION_ID is not set. Create it under Settings → Variables → Actions and set your subscription id."
            echo "::endgroup::"
            exit 1
          else
            echo "::notice title=Subscription OK::AZURE_SUBSCRIPTION_ID=present"
          fi

      - name: Validate SQL Admin Password
        run: |
          if [[ -z "${{ secrets.SQL_ADMIN_PASSWORD }}" ]]; then
            echo "::error title=Missing SQL Admin Password::Secret SQL_ADMIN_PASSWORD is not set. Create it under Settings → Secrets and variables → Actions → New repository secret."
            echo "::error::The password must be at least 8 characters and contain uppercase, lowercase, numbers, and symbols."
            exit 1
          else
            echo "::notice title=SQL Password OK::SQL_ADMIN_PASSWORD secret is configured"
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name ${{ env.AZURE_RESOURCE_GROUP_NAME }} \
              --location ${{ env.AZURE_LOCATION }}

      - name: Deploy Azure Infrastructure
        id: deploy-infra
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ env.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP_NAME }}
          template: ./infrastructure/main.bicep
          parameters: >
            webAppName=${{ env.AZURE_WEBAPP_NAME }}
            location=${{ env.AZURE_LOCATION }}
            appServicePlanSku=${{ env.APP_SERVICE_PLAN_SKU }}
            nodeVersion=22-lts
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
          failOnStdErr: false

      - name: Configure Azure AD Administrator for SQL Server
        run: |
          echo "Configuring Azure AD administrator for SQL Server..."
          bash ./scripts/configure-azuread-admin.sh \
            "${{ env.AZURE_RESOURCE_GROUP_NAME }}" \
            "${{ steps.deploy-infra.outputs.sqlServerName }}" \
            "${{ vars.SQL_AZUREAD_ADMIN_USER || '' }}" \
            "${{ vars.SQL_AZUREAD_ADMIN_OBJECT_ID || '' }}"

      - name: Wait for Azure AD configuration to propagate
        run: |
          echo "Waiting 60 seconds for Azure AD administrator configuration to propagate..."
          sleep 60

      - name: Configure Managed Identity Database Access
        run: |
          echo "Configuring managed identity access to SQL Database..."
          bash ./scripts/configure-managed-identity.sh \
            "${{ env.AZURE_RESOURCE_GROUP_NAME }}" \
            "${{ steps.deploy-infra.outputs.sqlServerName }}" \
            "${{ steps.deploy-infra.outputs.sqlDatabaseName }}" \
            "${{ steps.deploy-infra.outputs.webAppName }}" \
            "sqladmin" \
            "${{ secrets.SQL_ADMIN_PASSWORD }}"

      - name: Initialize Database Schema
        run: |
          echo "Initializing database schema and sample data..."
          bash ./scripts/initialize-database.sh \
            "${{ env.AZURE_RESOURCE_GROUP_NAME }}" \
            "${{ steps.deploy-infra.outputs.sqlServerName }}" \
            "${{ steps.deploy-infra.outputs.sqlDatabaseName }}" \
            "sqladmin" \
            "${{ secrets.SQL_ADMIN_PASSWORD }}"

      - name: Azure Logout
        if: always()
        run: az logout

  test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Test health endpoint
        run: |
          set -euo pipefail
          WEBAPP_URL="${{ needs.deploy.outputs.webapp-url }}"
          HEALTH_URL="${WEBAPP_URL}/api/health"
          
          echo "Testing health endpoint at: ${HEALTH_URL}"
          echo "Waiting 30 seconds for deployment to stabilize..."
          sleep 30
          
          # Try up to 5 times with 10 second intervals
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1)) of ${MAX_RETRIES}..."
            
            # Capture both response body and HTTP status code
            RESPONSE=$(curl -s -w "\n%{http_code}" "${HEALTH_URL}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            
            echo "HTTP Status: ${HTTP_CODE}"
            echo "Response Body:"
            echo "${BODY}"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Health endpoint is available and returned 200 OK"
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Health endpoint not ready yet, waiting 10 seconds..."
              sleep 10
            fi
          done
          
          echo "::error title=Health Check Failed::Health endpoint at ${HEALTH_URL} did not respond with 200 OK after ${MAX_RETRIES} attempts"
          exit 1

      - name: Test database initialization
        run: |
          set -euo pipefail
          WEBAPP_URL="${{ needs.deploy.outputs.webapp-url }}"
          USERS_URL="${WEBAPP_URL}/api/users"
          
          echo "Testing database initialization at: ${USERS_URL}"
          echo "Waiting 10 seconds for database to be ready..."
          sleep 10
          
          # Try up to 5 times with 10 second intervals
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1)) of ${MAX_RETRIES}..."
            
            # Capture both response body and HTTP status code
            RESPONSE=$(curl -s -w "\n%{http_code}" "${USERS_URL}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            
            echo "HTTP Status: ${HTTP_CODE}"
            echo "Response Body:"
            echo "${BODY}"
            
            # Check if we got a successful response
            if [ "$HTTP_CODE" = "200" ]; then
              # Verify the response is valid JSON and contains data
              if echo "$BODY" | jq empty 2>/dev/null; then
                USER_COUNT=$(echo "$BODY" | jq '. | length' 2>/dev/null || echo "0")
                echo "✓ Database is initialized with ${USER_COUNT} users"
                
                if [ "$USER_COUNT" -gt 0 ]; then
                  echo "✓ Database contains sample data"
                  exit 0
                else
                  echo "⚠ Warning: Database is initialized but contains no users"
                  exit 0
                fi
              else
                echo "✗ Response is not valid JSON"
              fi
            elif [ "$HTTP_CODE" = "503" ]; then
              ERROR_MSG=$(echo "$BODY" | jq -r '.error' 2>/dev/null || echo "$BODY")
              if [[ "$ERROR_MSG" == *"Database not initialized"* ]]; then
                echo "Database not yet initialized, will retry..."
              else
                echo "Service unavailable: $ERROR_MSG"
              fi
            else
              echo "Unexpected HTTP status code: ${HTTP_CODE}"
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Database not ready yet, waiting 10 seconds..."
              sleep 10
            fi
          done
          
          echo "::error title=Database Initialization Failed::Database at ${USERS_URL} was not initialized after ${MAX_RETRIES} attempts"
          echo "::error::The /api/users endpoint should return a 200 status with user data, but it did not."
          exit 1

  build:
    runs-on: ubuntu-latest
    needs: infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app for production
        run: npm run build

      - name: Prepare deployment package
        run: |
          # Create a deployment directory
          mkdir -p deploy-package

          # Copy built client files to dist folder
          cp -r ui-dist deploy-package/dist

          # Copy built server files
          cp -r server-dist deploy-package/server-dist

          # Copy package.json and package-lock.json for production dependencies
          cp package.json package-lock.json deploy-package/

          # Create .deployment file to skip build (already built)
          cat > deploy-package/.deployment << 'EOF'
          [config]
          SCM_DO_BUILD_DURING_DEPLOYMENT = false
          EOF

          # Create a production-ready package.json (only production dependencies)
          cd deploy-package
          # Remove devDependencies from package.json for lighter deployment
          node -e "const pkg=require('./package.json'); delete pkg.devDependencies; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [infrastructure, build]
    outputs:
      webapp-url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./node-app

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.infrastructure.outputs.webAppName }}
          # The build artifact is uploaded as the 'node-app' artifact. Downloaded by
          # actions/download-artifact it will be available under ./node-app. The
          # actual web app package (index.html, assets) lives in the dist folder
          # configured by AZURE_WEBAPP_PACKAGE_PATH (default: ui-dist). Point the
          # deploy action at that folder so index.html is deployed to the site root.
          # actions/upload-artifact uploads the CONTENTS of the folder you point at
          # (ui-dist) into the artifact root. When actions/download-artifact
          # extracts it to ./node-app the built site files are at ./node-app/, not
          # ./node-app/ui-dist. Point the deploy action at the artifact root.
          package: ./node-app

      - name: Azure Logout
        if: always()
        run: az logout
